<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules - 醫療管理系統</title>
    <link rel="stylesheet" href="css/schedules.css">
</head>
<body>

    <nav class="navbar">
    <div class="nav-left">
        <button onclick="location.href='index.html'">Login</button>
        <button onclick="location.href='patients.html'">Patients</button>
        <button onclick="location.href='records.html'">Records</button>
        <button class="active" onclick="location.href='schedules.html'">Schedules</button>
        <button onclick="location.href='resources.html'">MedicalResourceUsage</button>
        <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
</nav>

    <main class="schedules-container">
        
        <section class="search-section">
            <div class="avatar-circle">👤</div>
            <div class="search-group">
                <label>醫療人員 ID:</label>
                <input type="text" id="scheduleSearchInput" placeholder="輸入人員 ID (例如: P001)...">
                <button class="btn-orange-search" id="scheduleSearchBtn">查詢</button>
            </div>
        </section>

        <div class="main-grid">
            
            <section class="schedule-column-card">
                <h2 class="column-title">科別</h2>
                <div class="form-item">
                    <label>科別 ID</label>
                    <input type="text" id="deptId" readonly>
                </div>
                <div class="form-item">
                    <label>科別名稱</label>
                    <input type="text" id="deptName" readonly>
                </div>
                <div class="form-item">
                    <label>科別簡介</label>
                    <textarea id="deptDesc" readonly></textarea>
                </div>
            </section>

            <section class="schedule-column-card">
                <h2 class="column-title">醫療人員基本資料</h2>
                <div class="form-item">
                    <label>姓名</label>
                    <input type="text" id="staffName">
                </div>
                <div class="form-item">
                    <label>性別</label>
                    <select id="staffGender">
                        <option value="">請選擇</option>
                        <option value="M">男</option>
                        <option value="F">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>職稱</label>
                    <input type="text" id="staffTitle">
                </div>
                <div class="form-item">
                    <label>年資</label>
                    <input type="text" id="staffExperience">
                </div>
            </section>

            <section class="schedule-column-card">
                <h2 class="column-title">時間排程</h2>
                <div class="form-item">
                    <label>日期</label>
                    <input type="date" id="scheduleDate">
                </div>
                <div class="form-item">
                    <label>員工編號</label>
                    <input type="text" id="staffId">
                </div>
                <div class="form-item">
                    <label>時段</label>
                    <select id="scheduleSlot">
                        <option value="">請選擇時段</option>
                        <option value="morning">上午診</option>
                        <option value="afternoon">下午診</option>
                        <option value="evening">夜診</option>
                    </select>
                </div>
            </section>
        </div>

        <div class="bottom-actions">
            <button class="btn-action-green">確認登記</button>
            <button class="btn-action-red">取消重填</button>
        </div>

    </main>

    <script src="js/schedules.js"></script>
</body>
</html>
