<div class="schedules-container">
    <div class="search-section">
        <div class="avatar-circle"></div>
        <div class="search-group">
            <label>Patient ID:</label>
            <input type="text" placeholder="輸入 ID...">
            <button class="btn-orange-search">查詢</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="schedule-column-card">
            <div class="column-title">科別</div>
            <div class="form-item"><label>科別 ID</label><input type="text"></div>
            <div class="form-item"><label>科別名稱</label><input type="text"></div>
            <div class="form-item"><label>科別簡介</label><textarea></textarea></div>
        </div>

        <div class="schedule-column-card">
            <div class="column-title">員工基本資料</div>
            <div class="form-item"><label>姓名</label><input type="text"></div>
            <div class="form-item">
                <label>性別</label>
                <select><option>請選擇</option></select>
            </div>
            <div class="form-item"><label>職稱</label><input type="text"></div>
            <div class="form-item"><label>年資</label><input type="text"></div>
        </div>

        <div class="schedule-column-card">
            <div class="column-title">時間排程</div>
            <div class="form-item"><label>日期</label><input type="date"></div>
            <div class="form-item"><label>員工編號</label><input type="text"></div>
            <div class="form-item">
                <label>時段</label>
                <select><option>請選擇時段</option></select>
            </div>
        </div>
    </div>
</div>
