<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedules - 醫療管理系統</title>
    <link rel="stylesheet" href="css/schedules.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <button onclick="location.href='index.html'">Login</button>
            <button onclick="location.href='patients.html'">Patients</button>
            <button onclick="location.href='records.html'">Records</button>
            <button class="active" onclick="location.href='schedules.html'">Schedules</button>
            <button onclick="location.href='resources.html'">MedicalResourceUsage</button>
        </div>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </nav>

    <main class="schedules-container">
        
        <section class="search-section">
            <div class="avatar-circle">
                👤
            </div>
            <div class="search-group">
                <label>Patient ID:</label>
                <input type="text" placeholder="輸入病患 ID...">
                <button class="btn-orange-search">查詢</button>
            </div>
        </section>

        <div class="main-grid">
            
            <section class="schedule-column-card">
                <h2 class="column-title">科別</h2>
                <div class="form-item">
                    <label>科別 ID</label>
                    <input type="text">
                </div>
                <div class="form-item">
                    <label>科別名稱</label>
                    <input type="text">
                </div>
                <div class="form-item">
                    <label>科別簡介</label>
                    <textarea></textarea>
                </div>
            </section>

            <section class="schedule-column-card">
                <h2 class="column-title">員工基本資料</h2>
                <div class="form-item">
                    <label>姓名</label>
                    <input type="text">
                </div>
                <div class="form-item">
                    <label>性別</label>
                    <select>
                        <option value="">請選擇</option>
                        <option value="M">男</option>
                        <option value="F">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>職稱</label>
                    <input type="text">
                </div>
                <div class="form-item">
                    <label>年資</label>
                    <input type="text">
                </div>
            </section>

            <section class="schedule-column-card">
                <h2 class="column-title">時間排程</h2>
                <div class="form-item">
                    <label>日期</label>
                    <input type="date">
                </div>
                <div class="form-item">
                    <label>員工編號</label>
                    <input type="text">
                </div>
                <div class="form-item">
                    <label>時段</label>
                    <select>
                        <option value="">請選擇時段</option>
                        <option value="morning">上午診</option>
                        <option value="afternoon">下午診</option>
                        <option value="evening">夜診</option>
                    </select>
                </div>
            </section>
        </div>

        <div class="bottom-actions">
            <button class="btn-confirm">確認登記</button>
            <button class="btn-cancel">取消重填</button>
        </div>

    </main>

    <script src="js/schedules.js"></script>
</body>
</html>
